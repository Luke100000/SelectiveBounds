name: Java CI with Gradle

on:
  push:
    branches-ignore:
      - 'l10n*'
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_ID: ${{ secrets.MR_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MR_API_TOKEN }}
      CURSEFORGE_ID: ${{ secrets.CF_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CF_API_TOKEN }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - uses: jungwinter/split@v2
        id: split
        with:
          separator: "+"
          msg: ${{ github.ref_name }}
      - name: "Upload Fabric"
        uses: Kir-Antipov/mc-publish@v3.3.0
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[Fabric ${{steps.split.outputs._1}}] SelectiveBounds - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "fabric/build/libs/selectivebounds-fabric-${{steps.split.outputs._1}}-${{steps.split.outputs._0}}.jar"
          loaders: |
            fabric
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 25

          fail-mode: skip
      - name: "Upload NeoForge"
        uses: Kir-Antipov/mc-publish@v3.3.0
        if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
        with:
          modrinth-id: ${{ env.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          curseforge-id: ${{ env.CURSEFORGE_ID }}
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}

          name: "[NeoForge ${{steps.split.outputs._1}}] SelectiveBounds - ${{steps.split.outputs._0}}"
          changelog-file: changelog.md
          version-type: release
          files: "neoforge/build/libs/selectivebounds-neoforge-${{steps.split.outputs._1}}-${{steps.split.outputs._0}}.jar"
          loaders: |
            neoforge
          game-versions: |
            ${{steps.split.outputs._1}}
          java: |
            Java 25

          fail-mode: skip
